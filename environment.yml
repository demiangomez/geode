name: geode
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - geopy
  - h5py
  - matplotlib
  - networkx
  - numpy=2.4.6
  - pandas
  - paramiko
  - psycopg2-binary
  - scandir>=1.6
  - scikit-learn>=1.1
  - scipy
  - tqdm
  - pytest
  - xmltodict
  - scikit-image
  - shapely
  - obspy
  - geopandas
  - cartopy>=0.22
  - pillow>=9.0
  - pip
  - pip:
    - anthropic
    - country_converter
    - charset-normalizer
    - dispy
    - hdf5storage
    - simplekml
    - textual>=0.50.0
    - rich>=13.0.0
    - staticmap>=0.5.4
    - weasyprint>=60.0
